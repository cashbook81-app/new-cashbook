name: Release Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_name:
        description: "Release version (e.g. 1.0.1). Leave blank to auto-increment build number."
        required: false
        default: ""
      build_type:
        description: "APK build type"
        required: true
        type: choice
        default: "auto"
        options:
          - auto
          - release
          - debug

permissions:
  contents: write

jobs:
  build-and-release-apk:
    name: Build & Publish Cash Control APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Compute semantic version & signing mode
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version_name }}
          INPUT_BUILD_TYPE: ${{ github.event.inputs.build_type }}
          HAS_RELEASE_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.STORE_PASSWORD != '' && secrets.KEY_PASSWORD != '' }}
        run: |
          RAW_VER="${INPUT_VERSION}"
          if [ -z "$RAW_VER" ]; then
            if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              RAW_VER="${GITHUB_REF_NAME#v}"
            else
              RAW_VER="1.0.${GITHUB_RUN_NUMBER}"
            fi
          fi
          RAW_VER="${RAW_VER#v}"
          RAW_VER="${RAW_VER#V}"

          CORE="${RAW_VER%%-*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CORE"
          if [[ "$MAJOR" =~ ^[0-9]+$ ]] && [[ "${MINOR:-0}" =~ ^[0-9]+$ ]] && [[ "${PATCH:-0}" =~ ^[0-9]+$ ]]; then
            VERSION_CODE=$(( 10#$MAJOR * 10000 + 10#${MINOR:-0} * 100 + 10#${PATCH:-0} ))
          else
            VERSION_CODE=$(( GITHUB_RUN_NUMBER ))
          fi
          if [ "$VERSION_CODE" -lt 1 ]; then
            VERSION_CODE=1
          fi

          if [ "${INPUT_BUILD_TYPE}" = "release" ]; then
            SIGNING_MODE="release"
          elif [ "${INPUT_BUILD_TYPE}" = "debug" ]; then
            SIGNING_MODE="debug"
          elif [ "${HAS_RELEASE_KEYSTORE}" = "true" ]; then
            SIGNING_MODE="release"
          else
            SIGNING_MODE="debug"
          fi

          echo "version_name=${RAW_VER}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "signing_mode=${SIGNING_MODE}" >> "$GITHUB_OUTPUT"
          echo "Resolved v${RAW_VER} (code ${VERSION_CODE}, mode=${SIGNING_MODE})"

      - name: Configure debug keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 --decode debug.keystore.base64 > debug.keystore
          fi

      - name: Decode release keystore (if configured)
        if: steps.version.outputs.signing_mode == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Release build selected, but KEYSTORE_BASE64 secret is missing."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks

      - name: Verify unit and UI tests
        run: |
          gradle :app:testDebugUnitTest \
            --tests "com.example.update.*" \
            --tests "com.example.ui.*" \
            --tests "com.example.ExampleRobolectricTest" \
            --tests "com.example.ExampleUnitTest"

      - name: Build release APK
        if: steps.version.outputs.signing_mode == 'release'
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease \
            -PAPP_VERSION_CODE=${{ steps.version.outputs.version_code }} \
            -PAPP_VERSION_NAME=${{ steps.version.outputs.version_name }} \
            -PGITHUB_RELEASE_REPO=${{ github.repository }}

      - name: Build debug APK (fallback when release signing secrets are not set)
        if: steps.version.outputs.signing_mode == 'debug'
        run: |
          gradle assembleDebug \
            -PAPP_VERSION_CODE=${{ steps.version.outputs.version_code }} \
            -PAPP_VERSION_NAME=${{ steps.version.outputs.version_name }} \
            -PGITHUB_RELEASE_REPO=${{ github.repository }}

      - name: Prepare versioned APK asset
        id: apk
        run: |
          mkdir -p dist
          VERSION_NAME="${{ steps.version.outputs.version_name }}"
          OUT_NAME="CashControl-v${VERSION_NAME}.apk"
          if [ "${{ steps.version.outputs.signing_mode }}" = "release" ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/${OUT_NAME}"
          else
            cp app/build/outputs/apk/debug/app-debug.apk "dist/${OUT_NAME}"
          fi
          echo "apk_path=dist/${OUT_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${OUT_NAME}" >> "$GITHUB_OUTPUT"
          ls -lh "dist/${OUT_NAME}"

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.apk_name }}
          path: ${{ steps.apk.outputs.apk_path }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: Cash Control v${{ steps.version.outputs.version_name }}
          files: ${{ steps.apk.outputs.apk_path }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
