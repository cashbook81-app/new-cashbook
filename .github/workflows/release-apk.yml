name: Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_name:
        description: "Release version (e.g. 1.0.1). Leave blank to auto-increment build number."
        required: false
        type: string
        default: ""
      build_type:
        description: "APK build type"
        required: true
        type: choice
        default: "auto"
        options:
          - auto
          - release
          - debug

permissions:
  contents: write

jobs:
  build-and-release-apk:
    name: Build & Publish Cash Control APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses & install SDK 36.1
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          mkdir -p "$SDK_DIR/licenses"
          for hash in 24333f8a63b6825ea9c5514f83c2829b004d1fee 8933bad161af4178b1185d1a37fbf41ea5269c55 d56f5187479451eabf01fb78af6dfcb131a6481e; do
            grep -qxF "$hash" "$SDK_DIR/licenses/android-sdk-license" 2>/dev/null || echo "$hash" >> "$SDK_DIR/licenses/android-sdk-license"
          done
          grep -qxF "84831b9409646a918e30573bab4c9c91346d8abd" "$SDK_DIR/licenses/android-sdk-preview-license" 2>/dev/null || echo "84831b9409646a918e30573bab4c9c91346d8abd" >> "$SDK_DIR/licenses/android-sdk-preview-license"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
          sdkmanager "platforms;android-36.1" || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Compute semantic version & signing mode
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version_name }}
          INPUT_BUILD_TYPE: ${{ inputs.build_type }}
          SECRET_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PW: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PW: ${{ secrets.KEY_PASSWORD }}
        run: |
          RAW_VER="${INPUT_VERSION}"
          if [ -z "$RAW_VER" ]; then
            if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              RAW_VER="${GITHUB_REF_NAME#v}"
            else
              RAW_VER="1.0.${GITHUB_RUN_NUMBER}"
            fi
          fi
          RAW_VER="${RAW_VER#v}"
          RAW_VER="${RAW_VER#V}"

          CORE="${RAW_VER%%-*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CORE"
          if [[ "$MAJOR" =~ ^[0-9]+$ ]] && [[ "${MINOR:-0}" =~ ^[0-9]+$ ]] && [[ "${PATCH:-0}" =~ ^[0-9]+$ ]]; then
            VERSION_CODE=$(( 10#$MAJOR * 1000000 + 10#${MINOR:-0} * 1000 + 10#${PATCH:-0} ))
          else
            VERSION_CODE=$(( GITHUB_RUN_NUMBER ))
          fi
          if [ "$VERSION_CODE" -lt 1 ]; then
            VERSION_CODE=1
          fi

          HAS_RELEASE_KEYSTORE="false"
          if [ -n "$SECRET_KEYSTORE" ] && [ -n "$SECRET_STORE_PW" ] && [ -n "$SECRET_KEY_PW" ]; then
            HAS_RELEASE_KEYSTORE="true"
          fi

          if [ "${INPUT_BUILD_TYPE}" = "release" ]; then
            SIGNING_MODE="release"
          elif [ "${INPUT_BUILD_TYPE}" = "debug" ]; then
            SIGNING_MODE="debug"
          elif [ "${HAS_RELEASE_KEYSTORE}" = "true" ]; then
            SIGNING_MODE="release"
          else
            SIGNING_MODE="debug"
          fi

          echo "version_name=${RAW_VER}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "signing_mode=${SIGNING_MODE}" >> "$GITHUB_OUTPUT"
          echo "Resolved v${RAW_VER} (code ${VERSION_CODE}, mode=${SIGNING_MODE})"

      - name: Configure debug keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 --decode debug.keystore.base64 > debug.keystore
          fi

      - name: Decode release keystore (if configured)
        if: steps.version.outputs.signing_mode == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Release build selected, but KEYSTORE_BASE64 secret is missing."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks

      - name: Verify unit and UI tests
        run: |
          gradle :app:testDebugUnitTest \
            --tests "com.example.update.*" \
            --tests "com.example.ui.*" \
            --tests "com.example.ExampleRobolectricTest" \
            --tests "com.example.ExampleUnitTest" \
            -PAPP_VERSION_CODE=${{ steps.version.outputs.version_code }} \
            -PAPP_VERSION_NAME=${{ steps.version.outputs.version_name }} \
            -PGITHUB_RELEASE_REPO=${{ github.repository }} \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            --stacktrace

      - name: Build release APK
        if: steps.version.outputs.signing_mode == 'release'
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease \
            -PAPP_VERSION_CODE=${{ steps.version.outputs.version_code }} \
            -PAPP_VERSION_NAME=${{ steps.version.outputs.version_name }} \
            -PGITHUB_RELEASE_REPO=${{ github.repository }} \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            --stacktrace

      - name: Build debug APK (fallback when release signing secrets are not set)
        if: steps.version.outputs.signing_mode == 'debug'
        run: |
          gradle assembleDebug \
            -PAPP_VERSION_CODE=${{ steps.version.outputs.version_code }} \
            -PAPP_VERSION_NAME=${{ steps.version.outputs.version_name }} \
            -PGITHUB_RELEASE_REPO=${{ github.repository }} \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            --stacktrace

      - name: Prepare versioned APK asset
        id: apk
        run: |
          mkdir -p dist
          VERSION_NAME="${{ steps.version.outputs.version_name }}"
          OUT_NAME="CashControl-v${VERSION_NAME}.apk"
          if [ "${{ steps.version.outputs.signing_mode }}" = "release" ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/${OUT_NAME}"
          else
            cp app/build/outputs/apk/debug/app-debug.apk "dist/${OUT_NAME}"
          fi
          echo "apk_path=dist/${OUT_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${OUT_NAME}" >> "$GITHUB_OUTPUT"
          ls -lh "dist/${OUT_NAME}"

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.apk_name }}
          path: ${{ steps.apk.outputs.apk_path }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          target_commitish: ${{ github.sha }}
          name: Cash Control v${{ steps.version.outputs.version_name }}
          files: ${{ steps.apk.outputs.apk_path }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
